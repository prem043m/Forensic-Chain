<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForensicChain — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c10;
    --bg2: #111418;
    --bg3: #181c23;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e8eaf0;
    --text2: #8892a4;
    --text3: #4a5568;
    --blue: #4f8ef7;
    --blue-bg: rgba(79,142,247,0.12);
    --green: #34d399;
    --green-bg: rgba(52,211,153,0.1);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.1);
    --amber: #fbbf24;
  }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(79,142,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,142,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    padding: 20px;
  }

  .logo-wrap {
    text-align: center; margin-bottom: 32px;
  }

  .logo-icon {
    width: 56px; height: 56px;
    background: var(--blue-bg);
    border: 1px solid rgba(79,142,247,0.3);
    border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }

  .logo-icon svg { width: 28px; height: 28px; }

  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: var(--blue); }

  .tagline {
    font-size: 12px; color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 6px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }

  .form-group { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 6px;
  }

  input {
    width: 100%; padding: 10px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--blue); }

  .btn {
    width: 100%; padding: 12px;
    background: var(--blue);
    border: none; border-radius: 8px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s;
    margin-top: 8px;
  }

  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.99); }

  .alert {
    padding: 10px 14px; border-radius: 8px;
    font-size: 13px; margin-bottom: 16px;
    display: none;
  }

  .alert-err { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
  .alert-ok  { background: var(--green-bg); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }

  .info-text {
    color: var(--text2); font-size: 13px; margin-bottom: 16px; line-height: 1.5;
  }

  .back-link {
    text-align: center; margin-top: 15px;
  }

  .back-link a {
    color: var(--blue); text-decoration: none; font-size: 12px;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4f8ef7" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>Forensic<span>Chain</span></h1>
    <div class="tagline">Blockchain Evidence Management</div>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 16px; font-size: 18px;">Reset Your Password</h2>
    
    <div class="alert alert-err" id="reset-err"></div>
    <div class="alert alert-ok" id="reset-ok"></div>
    
    <p class="info-text">Enter your new password below. Passwords must be at least 12 characters and include uppercase, lowercase, number, and symbol.</p>
    
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-pass" placeholder="Min 12 chars with upper/lower/number/symbol">
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="new-pass-confirm" placeholder="Re-enter your password">
    </div>
    
    <button class="btn" onclick="doResetPassword()">Reset Password</button>
    
    <div class="back-link">
      <a href="index.html">Back to Sign In</a>
    </div>
  </div>
</div>

<script>
function getQueryParam(name) {
  const url = new URLSearchParams(window.location.search);
  return url.get(name);
}

function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  if (id === 'reset-ok') setTimeout(() => window.location.href = 'index.html', 2000);
}

async function doResetPassword() {
  const email = getQueryParam('email');
  const token = getQueryParam('token');
  const password = document.getElementById('new-pass').value;
  const password_confirm = document.getElementById('new-pass-confirm').value;

  if (!email || !token) {
    showAlert('reset-err', 'Invalid reset link. Please request a new one.');
    return;
  }

  if (!password || !password_confirm) {
    showAlert('reset-err', 'Fill in all fields');
    return;
  }

  if (password !== password_confirm) {
    showAlert('reset-err', 'Passwords do not match');
    return;
  }

  if (password.length < 12) {
    showAlert('reset-err', 'Password must be at least 12 characters');
    return;
  }

  const res = await fetch('/api/auth/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, token, password})
  });

  const data = await res.json();
  if (res.ok) {
    showAlert('reset-ok', 'Password reset successful! Redirecting to login...');
  } else {
    showAlert('reset-err', data.error || 'Failed to reset password');
  }
}

// Check if token and email exist
window.addEventListener('load', () => {
  const email = getQueryParam('email');
  const token = getQueryParam('token');
  
  if (!email || !token) {
    showAlert('reset-err', 'Invalid reset link. Please request a new password reset.');
    document.querySelector('.btn').disabled = true;
  }
});
</script>
</body>
</html>
