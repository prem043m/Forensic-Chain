<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForensicChain — Reset Password</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef5ff;
    --bg2: #ffffff;
    --bg3: #f7faff;
    --border: #d3e2ff;
    --border2: #b5cdf7;
    --text: #1e2a44;
    --text2: #4b5f84;
    --text3: #7388ae;
    --blue: #2457d6;
    --blue-bg: #e9f0ff;
    --green: #166534;
    --green-bg: #ecfdf3;
    --red: #b42318;
    --red-bg: #fef3f2;
    --amber: #b45309;
    --accent: #0ea5a4;
  }

  body {
    font-family: 'Manrope', sans-serif;
    background: radial-gradient(circle at 12% 10%, #dff0ff 0%, #eef5ff 40%, #e7efff 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      radial-gradient(circle at 85% 20%, rgba(14,165,164,0.22), transparent 32%),
      radial-gradient(circle at 10% 80%, rgba(36,87,214,0.2), transparent 30%);
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    padding: 20px;
  }

  .logo-wrap {
    text-align: center; margin-bottom: 32px;
  }

  .logo-icon {
    width: 56px; height: 56px;
    background: var(--blue-bg);
    border: 1px solid #a9c4f8;
    border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }

  .logo-icon svg { width: 28px; height: 28px; }

  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: var(--blue); }

  .tagline {
    font-size: 12px; color: var(--text2);
    font-family: 'Space Mono', monospace;
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 6px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 24px 50px rgba(36, 87, 214, 0.15);
    backdrop-filter: blur(4px);
  }

  .form-group { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    margin-bottom: 6px;
  }

  input {
    width: 100%; padding: 10px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(36,87,214,0.14); }

  .btn {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, #2457d6, #0ea5a4);
    border: none; border-radius: 8px;
    color: #fff;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
    margin-top: 8px;
  }

  .btn:hover { filter: brightness(1.05); box-shadow: 0 10px 24px rgba(36,87,214,0.28); transform: translateY(-1px); }
  .btn:active { transform: scale(0.99); }

  .alert {
    padding: 10px 14px; border-radius: 8px;
    font-size: 13px; margin-bottom: 16px;
    display: none;
  }

  .alert-err { background: var(--red-bg); color: var(--red); border: 1px solid #fecdca; }
  .alert-ok  { background: var(--green-bg); color: var(--green); border: 1px solid #b7ebc9; }

  .info-text {
    color: var(--text2); font-size: 13px; margin-bottom: 16px; line-height: 1.5;
  }

  .back-link {
    text-align: center; margin-top: 15px;
  }

  .back-link a {
    color: var(--blue); text-decoration: none; font-size: 12px;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4f8ef7" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>Forensic<span>Chain</span></h1>
    <div class="tagline">Blockchain Evidence Management</div>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 16px; font-size: 18px;">Reset Your Password</h2>
    
    <div class="alert alert-err" id="reset-err"></div>
    <div class="alert alert-ok" id="reset-ok"></div>
    
    <p class="info-text">Enter your new password below. Passwords must be at least 12 characters and include uppercase, lowercase, number, and symbol.</p>
    
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-pass" placeholder="Min 12 chars with upper/lower/number/symbol">
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="new-pass-confirm" placeholder="Re-enter your password">
    </div>
    
    <button class="btn" onclick="doResetPassword()">Reset Password</button>
    
    <div class="back-link">
      <a href="index.html">Back to Sign In</a>
    </div>
  </div>
</div>

<script>
function getQueryParam(name) {
  const url = new URLSearchParams(window.location.search);
  return url.get(name);
}

function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  if (id === 'reset-ok') setTimeout(() => window.location.href = 'index.html', 2000);
}

async function doResetPassword() {
  const email = getQueryParam('email');
  const token = getQueryParam('token');
  const password = document.getElementById('new-pass').value;
  const password_confirm = document.getElementById('new-pass-confirm').value;

  if (!email || !token) {
    showAlert('reset-err', 'Invalid reset link. Please request a new one.');
    return;
  }

  if (!password || !password_confirm) {
    showAlert('reset-err', 'Fill in all fields');
    return;
  }

  if (password !== password_confirm) {
    showAlert('reset-err', 'Passwords do not match');
    return;
  }

  if (password.length < 12) {
    showAlert('reset-err', 'Password must be at least 12 characters');
    return;
  }

  const res = await fetch('/api/auth/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, token, password})
  });

  const data = await res.json();
  if (res.ok) {
    showAlert('reset-ok', 'Password reset successful! Redirecting to login...');
  } else {
    showAlert('reset-err', data.error || 'Failed to reset password');
  }
}

// Check if token and email exist
window.addEventListener('load', () => {
  const email = getQueryParam('email');
  const token = getQueryParam('token');
  
  if (!email || !token) {
    showAlert('reset-err', 'Invalid reset link. Please request a new password reset.');
    document.querySelector('.btn').disabled = true;
  }
});
</script>
</body>
</html>
